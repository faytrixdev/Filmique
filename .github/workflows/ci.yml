name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck saas
        run: pnpm -C packages/saas exec next typegen && pnpm -C packages/saas exec tsc --noEmit
      - name: Unit tests (engine, studio, jobs, saas)
        run: pnpm -r test
      - name: Build saas
        run: pnpm -C packages/saas build
